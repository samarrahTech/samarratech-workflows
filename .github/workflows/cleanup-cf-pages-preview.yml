name: Clean up Cloudflare Pages preview

# Reusable: delete every Cloudflare Pages preview deployment of one PR branch
# (pr-<number>), the ones deploy-cf-pages.yml creates with `branch: pr-<n>`.
# Without this they are kept forever: one per push, each serving the PR's
# build on its own *.pages.dev URL.
#
# Safety: only branches named exactly pr-<number> are accepted, and only
# deployments whose environment is preview and whose branch matches are
# deleted, so a production deployment can never be selected. A Pages project
# must belong to one repo: pr-<n> means "PR n of the calling repo".
#
# It talks to the Cloudflare API with curl (no wrangler download): the API
# pages its listing, which `wrangler pages deployment list` does not (it
# returns the newest 25 only).
#
# Callers need secrets.CLOUDFLARE_API_TOKEN (Pages: Edit) and
# vars.CLOUDFLARE_ACCOUNT_ID, the same pair deploy-cf-pages.yml uses. See
# templates/caller-examples/dogfood-cleanup.yml.

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name
        type: string
        required: true
      branch:
        description: Preview branch to clean up, e.g. pr-123
        type: string
        required: true
    outputs:
      deleted:
        description: Number of preview deployments deleted
        value: ${{ jobs.cleanup.outputs.deleted }}
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    # A re-run while the first run is still deleting would try the same ids.
    concurrency:
      group: cleanup-cf-pages-preview-${{ inputs.project-name }}-${{ inputs.branch }}
      cancel-in-progress: false
    outputs:
      deleted: ${{ steps.delete.outputs.deleted }}
    steps:
      # These inputs end up in API URLs; whole-string matches.
      - name: Check inputs
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          BRANCH: ${{ inputs.branch }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]] || fail "project-name must be a Pages project name (lowercase letters, digits, hyphens), got '$PROJECT_NAME'"
          [[ "$BRANCH" =~ ^pr-[0-9]+$ ]] || fail "branch must be pr-<number>, got '$BRANCH'; this workflow only deletes PR previews"
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || fail "vars.CLOUDFLARE_ACCOUNT_ID is not set in the calling repo"
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]] || fail "vars.CLOUDFLARE_ACCOUNT_ID must be a 32-character hex account id"

      - name: Delete the branch's preview deployments
        id: delete
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project-name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME/deployments"
          cf() { curl -sS --fail-with-body --max-time 30 --retry 3 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          tmp="${RUNNER_TEMP:-/tmp}/cf-preview-cleanup"; mkdir -p "$tmp"; : > "$tmp/ids"
          # Collect every matching id first, then delete: deleting while paging
          # would shift the later pages. Prints the page count on stdout.
          pick='
            const b = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!b.success || !Array.isArray(b.result)) { console.error("Cloudflare API error:", JSON.stringify(b.errors)); process.exit(1); }
            const ids = b.result
              .filter((d) => d.environment === "preview" && d.deployment_trigger?.metadata?.branch === process.env.BRANCH)
              .map((d) => d.id);
            require("fs").appendFileSync(process.argv[2], ids.map((id) => id + "\n").join(""));
            console.log(b.result_info?.total_pages ?? 1);'
          page=1
          while :; do
            cf "$api?env=preview&per_page=25&page=$page" > "$tmp/page.json" || { echo "::error::listing page $page failed"; cat "$tmp/page.json"; exit 1; }
            pages=$(node -e "$pick" "$tmp/page.json" "$tmp/ids")
            (( page >= pages )) && break
            (( page >= 200 )) && { echo "::error::more than 200 pages of preview deployments; stopping"; exit 1; }
            page=$((page + 1))
          done
          deleted=0
          while read -r id; do
            [[ "$id" =~ ^[0-9a-f-]{36}$ ]] || { echo "::error::unexpected deployment id '$id'"; exit 1; }
            # force=true: the newest deployment of the branch carries its alias
            # (pr-<n>.<project>.pages.dev), which blocks a plain delete.
            cf -X DELETE "$api/$id?force=true" > "$tmp/delete.json" || { echo "::error::deleting $id failed"; cat "$tmp/delete.json"; exit 1; }
            deleted=$((deleted + 1))
          done < "$tmp/ids"
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          echo "Deleted $deleted preview deployment(s) of $BRANCH in $PROJECT_NAME (scanned $page page(s))." | tee -a "$GITHUB_STEP_SUMMARY"
