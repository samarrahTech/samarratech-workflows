name: Node CI

# Reusable CI for all Samarratech repos: typecheck / lint / test / build.
# Node version comes from the caller repo's package.json engines field
# (fleet policy: pin engines per repo; never pin a version here).

on:
  workflow_call:
    inputs:
      run-lint:
        description: Run `npm run lint` (skipped automatically if the script is absent)
        type: boolean
        default: true
      run-tests:
        description: Run `npm test`
        type: boolean
        default: true
      run-build:
        description: Run `npm run build` (skipped automatically if the script is absent)
        type: boolean
        default: true
      working-directory:
        description: Package directory, for repos with a nested package
        type: string
        default: '.'
      node-version-file:
        description: |
          File setup-node reads the Node version from, relative to
          working-directory. Defaults to package.json (`engines.node`); use
          .nvmrc for packages whose engines range is a consumer contract
          rather than a CI pin (e.g. published libraries).
        type: string
        default: package.json

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # Pin a bounded range in engines (e.g. "24.x"): setup-node resolves a
      # range to its newest match, so ">=24" would silently follow each new
      # Node major.
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.working-directory }}/${{ inputs.node-version-file }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - run: npm ci

      # Both script names exist in the fleet (typecheck / check-types);
      # --if-present makes whichever is absent a no-op.
      - name: Typecheck
        run: |
          npm run typecheck --if-present
          npm run check-types --if-present

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint --if-present

      - name: Test
        if: ${{ inputs.run-tests }}
        run: npm test

      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build --if-present
